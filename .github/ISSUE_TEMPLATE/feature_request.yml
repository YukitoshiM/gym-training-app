name: Feature request
description: Suggest a BodyMode improvement.
title: "[Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Do not include health records, photos, AI conversations, credentials, or personal information.
  - type: textarea
    id: problem
    attributes:
      label: What problem should BodyMode solve?
      description: Explain the task or difficulty, not private record contents.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a good result look like?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirmed that this request contains no personal, health, or authentication information.
          required: true
