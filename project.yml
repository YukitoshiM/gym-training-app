name: GymTrainingApp
options:
  bundleIdPrefix: com.yukitoshim
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 15
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: PXJ45MLX8V
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.7.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
targets:
  GymTrainingApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App.Debug.xcconfig
      Release: Config/App.Release.xcconfig
    sources:
      - path: GymTrainingApp
      - path: Shared
    dependencies:
      - target: GymTrainingWatchApp
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yukitoshim.gymtrainingapp
        CODE_SIGN_ENTITLEMENTS: GymTrainingApp/GymTrainingApp.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: BodyMode
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: GymTrainingApp/Info.plist
      properties:
        CFBundleDisplayName: BodyMode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BodyModeAIAPIKey: $(BODYMODE_AI_API_KEY)
        BodyModeAIBaseURL: $(BODYMODE_AI_BASE_URL)
        BodyModeAIConfigurationVersion: $(BODYMODE_AI_CONFIGURATION_VERSION)
        BodyModeAIUsesSessionTokens: $(BODYMODE_AI_USES_SESSION_TOKENS)
        BodyModeAdBannerUnitID: $(BODYMODE_ADMOB_BANNER_AD_UNIT_ID)
        BodyModePrivacyPolicyURL: ""
        BodyModeSupportEmail: ""
        BodyModeSupportURL: ""
        BodyModeTermsURL: ""
        GADApplicationIdentifier: $(BODYMODE_ADMOB_APP_ID)
        GADDelayAppMeasurementInit: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHealthShareUsageDescription: 歩数、活動量、睡眠、心拍などをまとめてコンディションとトレーニング傾向を表示します。
        NSHealthUpdateUsageDescription: Apple Watchで記録した筋力トレーニングと身体測定をApple Healthに保存します。
        NSCameraUsageDescription: 食事や体型の写真を撮影し、記録とAIによる参考分析に使用します。
        NSLocationAlwaysAndWhenInUseUsageDescription: 登録したジムへの到着と退出を記録する場合に位置情報を使用します。
        NSLocationWhenInUseUsageDescription: 現在地をジムとして登録し、ジム訪問を記録するために位置情報を使用します。
        NSLocalNetworkUsageDescription: Mac miniなど、ユーザーが指定したローカルAIサーバーへ接続するためにローカルネットワークを使用します。
        NSMotionUsageDescription: Apple Watchの動きからセット中の回数とテンポを推定します。
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
