        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  GymTrainingWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: GymTrainingWatchApp
      - path: Shared
    dependencies:
      - target: GymTrainingWatchWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yukitoshim.gymtrainingapp.watchkitapp
        CODE_SIGN_ENTITLEMENTS: GymTrainingWatchApp/GymTrainingWatchApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: BodyMode
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.yukitoshim.gymtrainingapp
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: 4
    info:
      path: GymTrainingWatchApp/Info.plist
      properties:
        CFBundleDisplayName: BodyMode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.yukitoshim.gymtrainingapp
        NSHealthShareUsageDescription: ワークアウト中の心拍と消費エネルギーを表示し、セットごとの負荷を記録します。
        NSHealthUpdateUsageDescription: Apple Watchで記録した筋力トレーニングをApple Healthに保存します。
        NSMotionUsageDescription: 手首の動きからセット中の回数とテンポを推定します。
        WKBackgroundModes:
          - workout-processing
  GymTrainingWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: GymTrainingWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yukitoshim.gymtrainingapp.watchkitapp.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: 4
        INFOPLIST_KEY_CFBundleDisplayName: BodyMode Session
    info:
      path: GymTrainingWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: BodyMode Session
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  GymTrainingAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GymTrainingAppUITests
    dependencies:
      - target: GymTrainingApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yukitoshim.gymtrainingapp.uitests
        TEST_TARGET_NAME: GymTrainingApp
        GENERATE_INFOPLIST_FILE: YES
  GymTrainingAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GymTrainingAppTests
    dependencies:
      - target: GymTrainingApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yukitoshim.gymtrainingapp.tests
        GENERATE_INFOPLIST_FILE: YES
  GymTrainingWatchAppUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: GymTrainingWatchAppUITests
    dependencies:
      - target: GymTrainingWatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yukitoshim.gymtrainingapp.watchkitapp.uitests
        TEST_TARGET_NAME: GymTrainingWatchApp
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: 4
