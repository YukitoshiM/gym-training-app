<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071323">
  <title>Gym Training — 食事AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06111f;
      --surface: #101d2d;
      --surface-2: #17263a;
      --line: #2a3b51;
      --text: #f4f7fb;
      --muted: #94a4ba;
      --accent: #5f87ff;
      --accent-2: #8ea9ff;
      --good: #45d7a0;
      --danger: #ff7185;
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 80% 0%, rgba(70, 112, 255, .18), transparent 28rem),
        linear-gradient(145deg, #071525, var(--bg));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }
    .shell { width: min(100% - 28px, 980px); margin: 0 auto; padding: 36px 0 64px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 5px; color: var(--accent-2); font-size: 12px; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 0; font-size: clamp(25px, 5vw, 38px); letter-spacing: -.04em; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 5px rgba(148,164,186,.1); }
    .status.ready .dot { background: var(--good); box-shadow: 0 0 0 5px rgba(69,215,160,.12); }
    .grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(300px, .92fr); gap: 18px; }
    .card { background: rgba(16, 29, 45, .9); border: 1px solid rgba(109, 135, 170, .2); border-radius: var(--radius); box-shadow: 0 18px 55px rgba(0,0,0,.24); overflow: hidden; }
    .upload { min-height: 490px; display: flex; flex-direction: column; }
    .dropzone { position: relative; flex: 1; min-height: 370px; display: grid; place-items: center; padding: 28px; cursor: pointer; overflow: hidden; }
    .dropzone:focus-visible { outline: 3px solid var(--accent); outline-offset: -4px; }
    .dropzone.drag { background: rgba(95,135,255,.08); }
    .placeholder { max-width: 340px; text-align: center; }
    .camera { display: grid; place-items: center; width: 68px; height: 68px; margin: 0 auto 18px; border-radius: 21px; background: rgba(95,135,255,.14); color: var(--accent-2); font-size: 29px; }
    .placeholder h2 { margin: 0 0 9px; font-size: 21px; }
    .placeholder p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }
    #preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    .upload-actions { display: flex; gap: 10px; padding: 15px; border-top: 1px solid var(--line); background: rgba(7,19,35,.7); }
    button, .file-button { min-height: 48px; border: 0; border-radius: 15px; padding: 0 18px; font: inherit; font-weight: 750; cursor: pointer; transition: transform .15s, opacity .15s, background .15s; }
    button:active, .file-button:active { transform: scale(.98); }
    button:disabled { opacity: .42; cursor: not-allowed; }
    .file-button { display: grid; place-items: center; flex: 1; background: var(--surface-2); color: var(--text); }
    #file { position: absolute; opacity: 0; pointer-events: none; }
    .primary { flex: 1.35; background: var(--accent); color: white; }
    .panel { padding: 22px; }
    .panel h2 { margin: 0 0 4px; font-size: 20px; }
    .panel .hint { margin: 0 0 21px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .field { margin-top: 14px; }
    label { display: block; margin: 0 0 7px; color: var(--muted); font-size: 12px; font-weight: 700; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 14px; background: #0b1726; color: var(--text); padding: 13px 14px; font: inherit; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(95,135,255,.14); }
    .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .metric { position: relative; }
    .metric input { padding-right: 47px; font-size: 18px; font-weight: 750; }
    .unit { position: absolute; right: 13px; bottom: 14px; color: var(--muted); font-size: 12px; }
    .confidence { display: none; margin-top: 17px; padding: 12px 14px; border-radius: 14px; background: rgba(69,215,160,.08); color: var(--good); font-size: 13px; line-height: 1.5; }
    .error { display: none; margin-top: 15px; padding: 12px 14px; border-radius: 14px; background: rgba(255,113,133,.09); color: var(--danger); font-size: 13px; line-height: 1.5; }
    .privacy { margin: 17px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .spinner { width: 17px; height: 17px; display: none; border: 2px solid rgba(255,255,255,.35); border-top-color: white; border-radius: 50%; animation: spin .8s linear infinite; }
    .loading .spinner { display: inline-block; }
    .loading .button-text { margin-left: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 760px) {
      .shell { padding-top: 22px; }
      header { align-items: flex-start; }
      .grid { grid-template-columns: 1fr; }
      .upload { min-height: 430px; }
      .dropzone { min-height: 310px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">GYM TRAINING AI</p><h1>写真から食事を記録</h1></div>
      <div class="status" id="status"><span class="dot"></span><span>接続確認中</span></div>
    </header>

    <div class="grid">
      <section class="card upload">
        <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="料理画像を選択">
          <div class="placeholder" id="placeholder">
            <div class="camera">▣</div>
            <h2>料理の写真を選択</h2>
            <p>写真を選ぶと、カロリー・料理名・PFCをAIが下書きします。推定後は自由に修正できます。</p>
          </div>
          <img id="preview" alt="選択した料理画像">
        </div>
        <div class="upload-actions">
          <label class="file-button" for="file">写真を選ぶ</label>
          <input id="file" type="file" accept="image/*" capture="environment">
          <button class="primary" id="analyze" disabled><span class="spinner"></span><span class="button-text">AIで推定</span></button>
        </div>
      </section>

      <section class="card panel">
        <h2>推定結果</h2>
        <p class="hint">数値は参考値です。保存前に量と栄養値を確認してください。</p>
        <div class="field"><label for="mealName">料理名</label><input id="mealName" placeholder="写真を解析すると自動入力"></div>
        <div class="field"><label for="mealType">食事</label><select id="mealType"><option value="breakfast">朝食</option><option value="lunch" selected>昼食</option><option value="dinner">夕食</option><option value="snack">間食</option></select></div>
        <div class="field metrics">
          <div class="metric"><label for="calories">カロリー</label><input id="calories" inputmode="decimal"><span class="unit">kcal</span></div>
          <div class="metric"><label for="protein">たんぱく質</label><input id="protein" inputmode="decimal"><span class="unit">g</span></div>
          <div class="metric"><label for="fat">脂質</label><input id="fat" inputmode="decimal"><span class="unit">g</span></div>
          <div class="metric"><label for="carbs">炭水化物</label><input id="carbs" inputmode="decimal"><span class="unit">g</span></div>
        </div>
        <div class="confidence" id="confidence"></div>
        <div class="error" id="error"></div>
        <div class="field"><label for="apiKey">APIキー</label><input id="apiKey" type="password" placeholder="公開用APIキーを入力" autocomplete="off"></div>
        <p class="privacy">画像は推定のためMac miniへ送信され、このWeb画面では保存しません。</p>
      </section>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    let selectedFile;
    const choose = file => {
      if (!file || !file.type.startsWith('image/')) return;
      selectedFile = file;
      $('preview').src = URL.createObjectURL(file);
      $('preview').style.display = 'block';
      $('placeholder').style.display = 'none';
      $('analyze').disabled = false;
      $('error').style.display = 'none';
    };
    $('file').addEventListener('change', e => choose(e.target.files[0]));
    $('dropzone').addEventListener('click', () => $('file').click());
    $('dropzone').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') $('file').click(); });
    ['dragenter','dragover'].forEach(name => $('dropzone').addEventListener(name, e => { e.preventDefault(); $('dropzone').classList.add('drag'); }));
    ['dragleave','drop'].forEach(name => $('dropzone').addEventListener(name, e => { e.preventDefault(); $('dropzone').classList.remove('drag'); }));
    $('dropzone').addEventListener('drop', e => choose(e.dataTransfer.files[0]));

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const setLoading = loading => {
      $('analyze').disabled = loading;
      $('analyze').classList.toggle('loading', loading);
      $('analyze').querySelector('.button-text').textContent = loading ? '推定中…' : 'もう一度推定';
    };
    $('analyze').addEventListener('click', async () => {
      if (!selectedFile) return;
      setLoading(true);
      $('error').style.display = 'none';
      try {
        const response = await fetch('/v1/meals/analyze-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${$('apiKey').value}` },
          body: JSON.stringify({ image_base64: await toBase64(selectedFile), meal_type: $('mealType').value, memo: 'Webから送信' })
        });
        if (!response.ok) throw new Error(`推定に失敗しました（${response.status}）`);
        const result = await response.json();
        $('mealName').value = result.meal_name || '';
        $('calories').value = Math.round(result.calories || 0);
        $('protein').value = Math.round((result.protein || 0) * 10) / 10;
        $('fat').value = Math.round((result.fat || 0) * 10) / 10;
        $('carbs').value = Math.round((result.carbs || 0) * 10) / 10;
        $('confidence').textContent = `AI信頼度: ${result.confidence || 'low'} — ${result.comment || ''}`;
        $('confidence').style.display = 'block';
      } catch (error) {
        $('error').textContent = error.message + '。サーバーとAPIキーを確認してください。';
        $('error').style.display = 'block';
      } finally { setLoading(false); }
    });
    fetch('/v1/health', { headers: { 'Authorization': `Bearer ${$('apiKey').value}` } })
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(() => { $('status').classList.add('ready'); $('status').lastElementChild.textContent = 'AI接続済み'; })
      .catch(() => { $('status').lastElementChild.textContent = '接続を確認'; });
  </script>
</body>
</html>
